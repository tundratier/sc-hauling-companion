# git-cliff configuration: version + changelog derived from Conventional Commits.
# Tags have no "v" prefix (git flow, empty version tag prefix).

[changelog]
header = """
# Changelog

"""
body = """
{% if version -%}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} **BREAKING**{% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = '[0-9]+[.][0-9]+[.][0-9]+'
sort_commits = "oldest"
commit_parsers = [
  # Merge commits created by git flow are exempt from the format.
  { message = "^Merge ", skip = true },
  { message = '^chore[(]release[)]', skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", skip = true },
]

[bump]
# First release is 1.0.0 because no tag exists yet; later versions are derived.
initial_tag = "1.0.0"
features_always_bump_minor = true
breaking_always_bump_major = true

x-dev: &dev
  build:
    context: .
    target: dev
  image: sc-hauling-companion-dev
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  dev:
    <<: *dev
    ports:
      - '5173:5173'
    environment:
      CHOKIDAR_USEPOLLING: 'true'

  test:
    <<: *dev
    command: npm run test -- --run
    environment:
      CI: 'true'

  lint:
    <<: *dev
    command: sh -c "npm run lint && npm run typecheck"

  app:
    build:
      context: .
      target: runtime
    image: sc-hauling-companion-app
    ports:
      - '8080:8080'

  # Terminal map compiler (docs/terminal-map.md): offline `--compile` / `--check` from tools/terminal-map/raw
  terminal-map:
    build:
      context: .
      dockerfile: tools/terminal-map/Dockerfile
    image: sc-hauling-companion-terminal-map
    volumes:
      - .:/work

  terminal-map-test:
    image: sc-hauling-companion-terminal-map
    entrypoint:
      ['python', '-I', '-m', 'unittest', 'discover', '-s', '/work/tools/terminal-map', '-v']
    volumes:
      - .:/work

volumes:
  node_modules:

x-dev: &dev
  build:
    context: .
    target: dev
  image: sc-hauling-companion-dev
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  dev:
    <<: *dev
    ports:
      - '5173:5173'
    environment:
      CHOKIDAR_USEPOLLING: 'true'

  test:
    <<: *dev
    command: npm run test -- --run
    environment:
      CI: 'true'

  lint:
    <<: *dev
    command: sh -c "npm run lint && npm run typecheck"

  app:
    build:
      context: .
      target: runtime
    image: sc-hauling-companion-app
    ports:
      - '8080:8080'

volumes:
  node_modules:
